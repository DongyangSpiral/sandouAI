spring:
  profiles:
    active: dev
  application:
    name: uams-server

server:
  port: 8080

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  global-config:
    db-config:
      id-type: auto
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

dfs:
  storage:
    type: local
    local:
      path: D:\schoolTools\uploads
      max-size: 524288000

sa-token:
  token-name: Authorization
  timeout: 2592000
  active-timeout: -1
  is-concurrent: true
  is-share: false
  is-log: true
  token-style: uuid
